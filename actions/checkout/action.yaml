name: 'Vercel Repository Dispatch - Checkout'
description: 'Action for Vercel repository dispatch deployment events. Automatically checks out the ref from the SHA of the deployment.'
inputs:
  ref:
    description: 'The branch, tag or SHA to checkout'
    required: false
  lfs:
    description: 'Whether to download Git LFS files'
    required: false
  fetch-depth:
    description: 'Number of commits to fetch. 0 for full history.'
    required: false
  token:
    description: 'The token to use for fetching'
    required: false
    default: '${{ github.token }}'
  filter:
    description: 'Sparse checkout filter'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Determine ref
      id: determine-ref
      shell: bash
      env:
        INPUT_REF: ${{ inputs.ref }}
        EVENT_NAME: ${{ github.event_name }}
        CLIENT_PAYLOAD_GIT_SHA: ${{ github.event.client_payload.git.sha }}
      run: |
        # If a ref is explicitly provided, use it
        if [[ -n "$INPUT_REF" ]]; then
          ref="$INPUT_REF"
          source="provided ref"
        # If the event is a repository_dispatch and the client_payload contains a SHA, use it
        elif [[ "$EVENT_NAME" == "repository_dispatch" && -n "$CLIENT_PAYLOAD_GIT_SHA" ]]; then
          ref="$CLIENT_PAYLOAD_GIT_SHA"
          source="client_payload SHA"
        else
          ref=""
          source="default ref (empty)"
        fi

        if [[ "$ref" == *$'\n'* || "$ref" == *$'\r'* ]]; then
          echo "::error::The ref must not contain newline characters"
          exit 1
        fi

        if [[ -n "$ref" ]]; then
          printf 'Using %s: %s\n' "$source" "$ref"
        else
          printf 'Using %s\n' "$source"
        fi
        printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #6.0.2
      with:
        ref: ${{ steps.determine-ref.outputs.ref }}
        lfs: ${{ inputs.lfs }}
        fetch-depth: ${{ inputs.fetch-depth }}
        token: ${{ inputs.token }}
        filter: ${{ inputs.filter }}
