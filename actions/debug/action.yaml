name: "Vercel Repository Dispatch - Debug"
description: "Action for Vercel repository dispatch deployment events. Useful for viewing the full payload from the event."

runs:
  using: "composite"
  steps:
    - name: Debug Client Payload
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        DEPLOYMENT_ID: ${{ github.event.client_payload.id || 'None' }}
        DEPLOYMENT_URL: ${{ github.event.client_payload.url || 'None' }}
        DEPLOYMENT_STATE: ${{ github.event.client_payload.state.type || 'None' }}
        DEPLOYMENT_STATE_DETAIL: ${{ github.event.client_payload.state.detail || 'N/A' }}
        PROJECT_ID: ${{ github.event.client_payload.project.id || 'None' }}
        PROJECT_NAME: ${{ github.event.client_payload.project.name || 'None' }}
        ENVIRONMENT: ${{ github.event.client_payload.environment || 'None' }}
        GIT_REF: ${{ github.event.client_payload.git.ref || 'None' }}
        GIT_SHA: ${{ github.event.client_payload.git.sha || 'None' }}
        GIT_SHORT_SHA: ${{ github.event.client_payload.git.shortSha || 'None' }}
        DEPLOYMENT_ERROR: ${{ github.event.client_payload.error }}
      run: |
        # Debugging Vercel Repository Dispatch Client Payload

        echo ""
        echo "🔍 Debugging Vercel Repository Dispatch Client Payload:"

        # Check if this is a repository_dispatch event
        if [[ "$EVENT_NAME" != "repository_dispatch" ]]; then
          echo "❌ This action is designed for repository_dispatch events only."
          printf '📋 Current event type: %s\n' "$EVENT_NAME"
          exit 0
        fi

        # Output the full client payload in a collapsible section
        echo "::group::📦 Raw Payload (Click to expand)"
        printf '%s\n' "$PAYLOAD"
        echo "::endgroup::"
        echo ""

        # output a header to indicate the individual fields
        echo "🔍 Details"

        # Output individual fields with prefixes
        echo "::group::  - 4. 🚀 Deployment"
        printf '🆔 Deployment ID: %s\n' "$DEPLOYMENT_ID"
        printf '🌐 Deployment URL: %s\n' "$DEPLOYMENT_URL"
        printf '📈 Deployment State: %s\n' "$DEPLOYMENT_STATE"
        printf '📋 Deployment State Details: %s\n' "$DEPLOYMENT_STATE_DETAIL"
        echo "::endgroup::"

        echo "::group::  - 1. 🏗️ Project"
        printf '🆔 Project ID: %s\n' "$PROJECT_ID"
        printf '📝 Project Name: %s\n' "$PROJECT_NAME"
        echo "::endgroup::"

        echo "::group::  - 2. 🌍 Environment"
        printf '🌱 Environment: %s\n' "$ENVIRONMENT"
        echo "::endgroup::"

        echo "::group::  - 3. 📚 Git"
        printf '🌿 Git Ref: %s\n' "$GIT_REF"
        printf '🔗 Git SHA: %s\n' "$GIT_SHA"
        printf '✂️ Short SHA: %s\n' "$GIT_SHORT_SHA"
        echo "::endgroup::"

        # Check for error information
        if [[ -n "$DEPLOYMENT_ERROR" ]]; then
          echo "::group::  - 5. ❌ Error Information"
          printf '💥 Error: %s\n' "$DEPLOYMENT_ERROR"
          echo "::endgroup::"
        fi

        echo ""
        echo "🎉 Debug output complete!"
        echo ""
